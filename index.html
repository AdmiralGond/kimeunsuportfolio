/ "],["1056"," - "],["1057","▶"]],"string_intro_2.csv":[["2001_title","소개"],["2001_keyword","게임 디자이너로서 나"],["20101","저는 플레이어에게 전달할 경험을 먼저 정의해서 이를 실제 게임 시스템으로 구현하고 그 필요성을 검증해 나가는 게임 디자이너입니다.<br><br>\n해상 미사일 시뮬레이션 게임을 개발하는 과정에서 현실의 개념 요소를 게임의 시스템으로 변환하고,<br>\n필요한 요소인지 확인하면서 개인 프로젝트를 진행 중에 있습니다.<br><br>\n초기에는 현실의 관성 항법 유도와 비슷하게 교전 채널 인덱스를 받지 않아도,<br>\n발사가 가능하게 구현했지만 의도했던 플레이 경험에 악영향 준다고 판단하여 제거했습니다.<br><br>\n반대로 객체가 자체 식별 시커를 보유한 미사일 무장을 추가했지만,<br>\n요격 확률의 증가를 얻는 방식(Risk of Retrun)으로<br>\n플레이어의 기본 무장과 차별화를 두어 플레이 선택지를 다양화하고자 했습니다."],["2002_keyword","현재 하고 있는 것"],["20201","게임을 플레이하는 과정에서 사용자의 행동 패턴과 의도, 게임 디자인을 분석하고 활용해 왔습니다.<br>\n기존에는 게임 내 승리를 위해서 40명 파티의 파티장으로 활동하면서 활용했지만, 이제는 그동안 해온 경험을 게임 개발에 활용하고 있습니다.<br><br>\n현재는 게임의 전략 경험을 바탕으로 현재는 밀리터리 덕후가 가진 군함 판타지를<br>\nRTS 장르의 게임으로 제공하는 해상 미사일 시뮬레이션을 개발하고 있습니다.<br>\nProject Name : ゼロ信号のつきがさ (제로신호의츠키가사, Zero Shingō no Tsukigasa)<br>\n[1차 프로토타입 빌드 (방어자의 경험)](https://admiralgond.github.io/ZeroShingoNoTsukigasa/)"],["2003_keyword","그동안 해온 것"],["20301","서브컬처 게임에서는 캐릭터와 함께하는 관계에 주목했습니다.<br>\n이에 사용자와 캐릭터의 관계를 맺어 오래 유지할 수 있는 경험을 중심으로 다양한 기획 문서를 작성해 왔습니다.<br><br>\n이렇게 서브컬처 게임의 로비 화면에서 캐릭터와 무언가 할 수 있는 경험을 추구하게 된 이유는 '칸코레'나 '블루 아카이브'를 플레이를 할 때,<br>\n듀얼 모니터 환경에서 로비 화면을 켜놓고 칸코레의 시보 대사를 들으면서 작업을 하거나,<br>\n다른 게임을 플레이했던 기억이 가장 선명하게 남아서 작성하게 되었습니다.<br>\n[문서 작성 포트폴리오](https://designer-kimeunsu.notion.site/400dab2edfee8036ba38c938637ca52d)"],["2004_keyword","오타쿠로서 나"],["20401","게임을 플레이하며 얻은 경험을 잇고,<br>\n관찰하며 읽어낸 플레이어의 의도를 담아, 새로운 플레이 경험을 설계한다.<br><br>\n이것이 게임 디자이너로서 지킬 나의 맹약.<br>\n아셴테(Aschente), 오타쿠 게임 디자이너 김은수."]],"string_develop_3.csv":[["3001_title","게임을 개발하고,"],["3001_keyword","프로젝트 테스트 영상"],["30101","첫번째는 단순히 레벨 디자인 즉 다수의 미사일 포화만으로 방어측의 방어 자원인 교전 채널의 한계를 만들어낼 수 있는 가를 확인하기 위해<br>\n구성한 자동 요격 실험 스테이지이며 확인해본 결과 레벨 디자인보다는 좀 더 교전 절차를 상세하게 나누는 시스템이 필요하다고 판단하게 되었습니다.<br>\n이에 클릭을 하면 바로 채널에 할당하는 방식 대신 별도의 예약 대기열 단계를 추가하고 사용 가능한 대기열 칸 수를 늘려 해결하고자 했습니다.<br><br>\n두번째는 프로젝트 명칭인 \"ZeroShingoNoTsukigasa (제로신호의 츠키가사)\"의 이름을 내러티브 시스템으로 표현하고자 만든 첫 게임 화면입니다.<br>\n컴퓨터의 0과 1과 신호의 노이즈, 잠금 레벨의 슬라이더가 움직일 때마다 다른 캐릭터 스프라이트를 보여주고,<br>\n캐릭터의 자세는 '제로(마음의)신호' 마음의 신호가 있을까라는 느낌으로 표현해보고자 했습니다. "],["3002_keyword","게임의 가치와 방향"],["30201","밀리터리 덕후가 원하는 것은 자신의 판단으로 전투의 승패를 가르는 지휘관의 경험.<br><br>\n저는 게임이 현실에서 체험하기 어려운 경험과 판타지를 대리 만족해주는 수단이라고 생각합니다.<br>\n현대 미사일 군함의 전투의 경우 밀리터리 덕후에게 매력적인 소재이지만 현실에서 직접 경험하기는 어렵습니다.<br><br>\n이에 군함에서 가장 위험한 적을 식별하고 요격하기까지의 판단 과정을 전략 게임의 경험으로 치환하여,<br>\n밀리터리 덕후가 현대 해전에 가진 판타지를 제공하는 게임을 개발하고 있습니다."],["3003_keyword","제공하고자 하는 경험"],["30301","이 게임이 전달하려는 전략성은 '시간이라는 단위의 수를 읽는 전투'입니다.<br><br>\n현재 화면에 보이는 미사일에 단순히 반응하지 않고,<br>\n”몇 초 뒤 어떤 미사일이 먼저 도착하고 어떤 교전 채널이 먼저 비는지를 읽은 뒤 다음 행동을 선행해서 준비하는 과정”을 목표 경험으로 하고 있습니다.<br><br>\n게임에서의 전략성은 언제나 적의 생각의 미래를 예측하고 심리 유도하는 미래의 상황을 예상해서,<br>\n현재의 상황을 대응하는 수의 전투라고 생각하며 저의 플레이 경험에서 비롯된 관점입니다.<br>\n현재 1차 프로토타입 빌드는 우선적으로 방어자의 경험을 구성하긴 시스템을 완성하는데 우선을 두고 있습니다."],["3004_keyword","플레이 경험을 반영"],["30401","그동안 게임의 전략 플레이 경험을 바탕으로 게임의 전략성을 검증하면서 구현하고 있습니다.<br>\n의도한 경험이 전달되는지 확인하며 실제로 필요한 시스템인지 판단하고 있습니다.<br><br>\n또한 저는 게임에서 큰 비중을 차지않는 전략 플레이 유형의 사용자이지만 전략 플레이어들은 장르 무관하게 대규모 멀티 FPS(배틀필드, 워독스)나,<br>\n턴제가 아닌 실시간 전투 방식의 토탈워 시리즈를 플레이할 때 턴제 체스를 하는 감각처럼 팀의 승리를 위한 미래 전략의 수를 두듯이 플레이합니다.<br>\n이 프로젝트는 전략계 플레이어가 여러 게임에서 경험하는 전략을 추구하는 과정의 비슷한 감각을 경험으로 제공하고자 합니다."]],"string_play_4.csv":[["4001_title","게임을 플레이하며,"],["4001_keyword","밀리터리 게임 경험"],["4001_table","table_play_4001_keyword.csv"],["40101","플레이어가 착임하였습니다. 지금부터 지휘를 맡습니다!"],["4002_keyword","서브컬처 게임 경험"],["4002_table","table_play_4002_keyword.csv"],["40201","실존하지 않은 존재라도 사랑이 하고 싶어! Take on me. [애정 캐릭터 선정 이유](https://designer-kimeunsu.notion.site/401dab2edfee80d29fd2df0597dd3ee2)<br>\n저에게 서브컬처 게임은 캐릭터와 함께 지친 일상에서 잠시 쉬어 가는 공간입니다.<br><br>\n칸코레에서는 오랜 시간 히비키를 육성하며 한 캐릭터에 대한 애정을 쌓아 치유 받았습니다.<br>\n블루 아카이브에서는 학생들이 생활하는 카페를 꾸미며 캐릭터와 함께 머무는 공간을 상상했습니다.<br>\n좋아하는 캐릭터를 바라보는 것만으로도 저절로 미소가 지어졌고 캐릭터와의 시간이 저에게 휴식이었습니다.<br><br>\n밀리터리 게임에서 판단이 강요되는 연속된 긴장감을 즐겼다면 서브컬처 게임에서는 캐릭터와 함께하는 일상의 편안함을 느꼈습니다.<br>\n이 경험을 통해 사용자와 캐릭터가 함께하는 시간을 어떻게 오래 이어갈 수 있을지 관심을 갖게 되었습니다.<br>"],["4003_keyword","인간 튜토리얼"],["40301","저는 초심자 플레이어들이 게임에 적응하기 쉽게 할 수 있도록 서포터를 해왔습니다.<br>\n'월드 오브 워쉽'에서는 공식 커뮤니티 이벤트로 진행된 초심자 가이드에서 당선된 것과,<br>\n'메이플 스토리'의 '엔젤릭버스터'길드의 2 & 4대 길드 마스터등을 수행하면서,<br>\n초심자 플레이어들이 게임을 이해하기 쉽게 적응할 수 있도록 게임의 용어를 이해시키는 것에 능숙했습니다.<br><br>\n하지만 실제 게임을 개발하면서 튜토리얼 구성하는데 정보 밀도와 전달력에 난항을 겪으며,<br>\n직접 옆에서 알려주는 것과 UX설계를 하는 것은 다르다는 것을 경험하게 되었습니다.<br>\n지금도 어떻게 해야 더 이해하기 쉽게 전달할 수 있을까 고민하며 지속적으로 수정 중에 있습니다."],["4004_keyword","나에게 서브컬처란"],["4004_table","table_play_4004_keyword.csv"],["40401","저는 서브컬처를 “자신의 애정 캐릭터에 대한 사랑과 이를 공유하는 문화”라고 보았습니다.<br>\n서브컬처라는 단어 자체 의미에 집중하기보다는,<br>일본풍 캐릭터 중심 서브컬처 소비 문화로 해석하였습니다.<br>\n단순히 캐릭터를 소비하는 것을 넘어, 일상과 경험 속에서 캐릭터와 함께하고<br>\n싶다는 감정을 기반으로 그 경험을 재해석하고 확장하며 공유하는 문화입니다.<br><br>\n예를 들어 굿즈나 인형을 일상 공간에 배치하거나<br>\n여행, 식사, 사진 기록 같은 현실 경험을 캐릭터와 연결해 공유하는 방식입니다.<br><br>\n이러한 관점에서 서브컬처 게임은 단순한 플레이 콘텐츠가 아니라고 생각하며,<br>\n사용자가 캐릭터와 만나고 경험을 확장해 나가는 공간이라고 판단합니다."]],"string_observe_5.csv":[["5001_title","게임을 관찰한다."],["5001_keyword","활용 방식 ①"],["50101","사용자 행동 패턴 분석을 하여 활용한다. 지휘관이 먼저 전장을 읽지 않으면, 아군을 이끌 수 없지 않겠는가?<br>\n저는 게임을 플레이하면서 사용자들이 반복하는 행동과 이동 패턴을 분석하고 활용했습니다.<br>\n온라인 슈팅 장르에서는 사용자의 반복 행동과 이동 흐름을 분석해 다음 행동을 예측했습니다.<br>\n이를 바탕으로 미리 판단하고 아군 사용자의 이동을 유도했습니다.<br><br>\n또한 상대 지휘관의 전략을 해석해 대응하고 개발사가 의도한 레벨 디자인의 유불리를 분석해 최대한 활용했습니다.<br>\n이렇게 사용자 행동과 전장의 맵을 분석한 결과를 실제 전투에 적용하며 팀의 승리를 이끌어 왔습니다."],["5002_keyword","활용 방식 ②"],["50201","서브컬처 게임에서는 사용자가 캐릭터를 반복적으로 터치하는 이유를 분석했습니다.<br><br>\n그 과정에서 서브컬처 사용자 행동에는 캐릭터의<br>\n다양한 반응을 확인하고 싶다는 기대가 담겨 있다고 해석했습니다.<br><br>\n앞으로는 이러한 관찰과 분석을 게임 개발에도 활용해 사용자의 기대를 확인하고,<br>\n이를 게임에서 제공하는 경험으로 연결하고자 합니다."]],"string_rts_6.csv":[["6001_title","미사일 RTS 시뮬레이션 프로젝트"],["6001_keyword","프로젝트 소개요"],["60101","플레이어의 판단 루프 : 플레이어는 신규 적 개체가 탐지 될때마다 현재 상황을 판단하고 다른 객체 대응까지 고려하여 신규 객체에 대해 대응해야 한다.<br>\n확률 기반의 밀리터리 전투를 구성하여 속도 변화 구간에서는 확률이 급하락하게 구현하고 각 무장별 역할 차이를 구현한다.<br>\n[공개용 1차 테스트빌드](https://admiralgond.github.io/ZeroShingoNoTsukigasa/)<br>\n- 프로젝트 개요 문서(노션)<br>\n[미사일 RTS 프로젝트 - 개요](https://designer-kimeunsu.notion.site/RTS-400dab2edfee80db8687e76eb7e90eae)<br>\n- 프로젝트 문제 해결 문서(노션)<br>\n[미사일 RTS 프로젝트 : 문제 해결](https://designer-kimeunsu.notion.site/RTS-400dab2edfee80549af9ecee402c2af2)<br>"],["6002_keyword","프로젝트 문서"],["60201","Project Name : ゼロ信号のつきがさ (제로신호의츠키가사, Zero Shingō no Tsukigasa)<br>\n시간 단위의 수 싸움, 그것이 이 프로젝트가 목표하는 경험<br>\n전투 구성의 3단계 : 현실의 방공 교전 단계와 비슷한 구성으로 한다.<br>\n게임의 기본 구성 : 확률 기반의 밀리터리 전투를 구성하여 속도 변화 구간에서는 확률이 급하락하게 구현하고 각 무장별 역할 차이를 구현한다.<br>\n1차 프로토타입에서는 방어자의 경험을 구현하며 2차 프로토타입에서는 공격자의 경험을 구현한다.<br>\n- 프로젝트 개요 문서(노션)<br>\n[미사일 RTS 프로젝트 - 개요](https://designer-kimeunsu.notion.site/RTS-400dab2edfee80db8687e76eb7e90eae)"],["6003_keyword","프로젝트 문제 해결"],["60301","무직경험  ~경험이 전달되지 않으면 해결하기 위해 최선을 다한다.~<br>\n- 프로젝트 문제 해결 문서(노션)<br>\n[미사일 RTS 프로젝트 : 문제 해결](https://designer-kimeunsu.notion.site/RTS-400dab2edfee80549af9ecee402c2af2)<br><br>\n프로젝트 초기 전투 시스템을 구현할 때 목표 했던 경험이 전달되지 않았으며 전투시스템 테스트 과정의 3명의 리뷰에서도 확인했습니다.<br>\n이에 채널링 시스템의 구조를 좀 더 디테일한 절차를 추가하고 그 과정에서 채널 포화도를 개선하여 목표했던 경험이 완성했습니다.<br>\n하지만 그 대가로 슈팅 캐주얼과 시뮬레이션 중 시뮬레이션에 더깝게되어 초기 진입 장벽의 정보 난이도가 올라가게 되었습니다."],["6004_keyword","초심자와 숙련자 차이"],["60401","초심자는 가장 가까워 보이는 위협에 반응하며 모든 동작 행동을 의식적으로 처리한다.<br>\n하지만 숙련될수록 버튼을 누르는 행동에 의식하지 않고 무의식적으로 처리하며<br>\n그만큼 플레이어 의식은 현재 상황보다 몇 초 뒤의 교전 상황을 더 많이 본다.<br><br>\n이것은 제가 생각하는 전략 유형의 플레이어 숙련도라고 판단합니다.<br>\n현재를 조작하여 대응하는 것보다 정보를 수집하고 분석하여 빠르게 판단하여 미래를 위해 대응한다.<br>\n이 프로젝트는 단순 조작하는 재미보다는 플레이어의 예측과 판단 능력을 숙련도의 기준으로 잡았습니다."]],"string_tamagotchi_7.csv":[["7001_title","다마고치 게임 프로젝트"],["7001_keyword","터치의 의미와 구상"],["70101","저는 서브컬처 게임에서 캐릭터를 터치하는 행동이 상호작용 반응을 확인하는 것을 넘어,<br>\n캐릭터와의 관계를 쌓아가는 행동으로 될 수 있다고 생각합니다.<br><br>\n이에 평소에도 사용자의 캐릭터 터치가 여러 호감도 수치로 누적되고,<br>\n그에 맞춰 캐릭터의 반응이 달라지는 다마고치 게임을 구상하고 있습니다.<br>\n구체적으로 터치라는 행동을 어떤 수치로 표현할지,<br>\n그 수치의 누적과 변화가 캐릭터와의 관계 변화로 이어지도록 어떤 수학 공식을 설계할지 고민하고 있습니다."],["7002_keyword","애정도 파라미터 분해"],["7002_table","table_tamagotchi_7002_keyword.csv"],["70201","기존 레벨이나 애정도 처럼 관계를 하나로 표현하지 않고,<br>\n사용자의 관심도와 캐릭터의 호감도를 구분해 애정도의 성장 계수로 하는 방식으로 진행 중에 있습니다."],["7003_keyword","목표 플레이 경험"],["70301","이 프로젝트에서는 사용자가 반복한 작은 행동들이 각 파라미터 수치로<br>\n캐릭터와의 관계가 깊어지는 경험으로 전달되게 하고 싶습니다.<br><br>\n사랑은 계산으로는 풀리지 않아.<br>\n그렇다면 터치로 쌓이는 관계는 어떤 공식으로 증명할 수 있을까?<br><br>\n좌표나 공식은 보이지도 않고 참고자료에도 나와있지 않기에 너와 만들어내고 싶어. 3차원 세계상 의 이 기분을 구하는 방법<br>\n※ Turing Love 가사 인용문"],["7004_keyword","다마고치 - 계획 단계"],["70401","현재는 \"Zero Shingō no Tsukigasa\"의 프로젝트가 2차 테스트빌드를 우선 시하고 있어 계획 구상 중에만 있습니다.<br>\n프로젝트의 명칭은 \"You See It or Her?\"로 선정할려고 합니다.<br><br>\n이 프로젝트 명칭은 당신(사용자)에게 있어 너에게 보이는 것은 \"It\"(인공적인것) 아니면 \"Her\"(그녀)의 질문입니다.<br>\n이 명칭으로 구상 중인 시스템은 게임 첫 시작 시 2가지 선택지가 주어지며,<br>\n첫번째 선택지 \"It\"을 고르면 플레이어에게 보여주는 UI화면은 UI레이아웃,<br>\n즉 UI파일명까지 적혀 있는 프레임 화면을 그대로 보여주고,<br>\n두번째 선택지를 \"Her\"고르면 캐릭터 스프라이트가 보여주는 방식으로 구상 중에 있습니다.<br>\n미사일 프로젝트 명칭인 \"Zero Shingō no Tsukigasa\"도<br>\n\"You See It or Her?\"라는 질문에서 만들어진 명칭입니다."]],"string_documents_8.csv":[["8001_title","기획 문서 작성 이력"],["8001_keyword","문서 작성 이력"],["8001_table","table_documents_8001_keyword.csv"],["80101","[서브컬처 게임 기획 문서](https://designer-kimeunsu.notion.site/400dab2edfee8036ba38c938637ca52d)"],["8002_keyword","문서의 접근 관점"],["80201","저는 서브컬처 게임 기획 문서를 작성할 때 고민한 질문은 하나였습니다.<br>\n\"게임 내 사용자가 캐릭터와의 경험을 어떻게 오래 유지하게 만들 것인가?\"<br><br>\n이 질문에서 출발해 사용자 행동과 캐릭터 반응 그리고 시간, 공간, 사운드, 캐릭터의 시선으로 기획 대상을 넓혔습니다.<br>\n각 요소가 사용자와 캐릭터의 관계에 어떤 영향을 주는지 살펴보고 상호작용과 환경 변화를 통해 그 관계를 이어가는 방법을 구체화했습니다."],["8003_keyword","프롤로그"],["80301","저는 서브컬처 게임에서 사용자가 평소에 접속한 순간도 캐릭터와 함께하는 경험을 만들고 싶습니다.<br><br>\n그리고 현실의 일상에서도 캐릭터와 함께하고 그걸 넓히려 했던 저의 경험은,<br>\n게임 속에서 사용자와 캐릭터의 관계를 확장하는 기획으로 이어졌습니다.<br><br>\n이를 위해 사용자가 실제로 게임을 이용하는 모습과 반복하는 행동을 관찰했습니다.<br>\n서울행 광역버스를 이용하거나 판교로 이동하면서 게임을 켜둔 채 다른 활동을 하거나 졸면서 게임을 방치하는 사용자도 보았습니다.<br>\n서브컬처 게임 스트리밍 크리에이터들이 여러 게임을 동시에 플레이하거나,<br>\n게임 화면을 켜둔 채 시청자와 대화하면서 게임을 방치하는 상황도 나옵니다.<br><br>\n이런 관찰을 통해 게임을 켜둔 채 다른 활동을 하거나 잠시 시선을 떼는 상황도 실제 서브컬처 게임 이용 경험의 일부라고 생각합니다.<br>\n또한 로비에 오래 머물거나 캐릭터를 반복해서 터치하는 행동<br>\n역시 사용자가 게임과 관계를 맺는 방식으로 바라보고 이를 캐릭터와의 상호작용으로 연결할 방법을 고민했습니다.<br>"],["8004_keyword","기여하고 싶습니다."],["80401","저는 캐릭터와 사용자의 관계를 지속시키는 경험을 설계하는 강점을 가지고 있습니다.<br><br>\n저는 캐릭터에 대한 애정을 바탕으로 사용자가 캐릭터와 어떤 방식으로 관계를 형성하고<br>\n그 경험을 지속하는지 관찰하고 고민해왔습니다.<br><br>\n사용자 행동에서 패턴을 찾고 이를 캐릭터의 반응과 상호작용 조건으로 구체화하는 것이 저의 강점입니다.<br>\n이 과정에서 쌓은 경험과 역량으로 서브컬처 게임의 다양한 경험 설계에 기여하고 싶습니다.<br>"]],"string_history_9.csv":[["9001_title","AI 워크플로우 및 기타"],["9001_keyword","AI 워크 플로우"],["90101","AI가 제가 원하는 걸 프롬포트 단어로 입력했을때 어떻게 이해했는지,<br>\n- 제가 생각하는 그 단어의 의미<br>\n- AI가 생각하는 그 단어의 의미<br><br>\n그 간격을 줄이고 AI가 제가 원하는 바를 재대로 이해 했는가 확인하기 위해서,<br>\n저의 AI작업 환경은 단계가 많은 방식으로 하네스를 구축하게 되었습니다.<br>"],["9002_keyword","플레이 이력 및 도대체<br>\n배경 이미지에 있는 게 무엇"],["90201","저는 다양한 게임을 플레이하며 사용자의 행동 패턴이 반복·형성되는 과정을 관찰하고,<br>\n이를 기반으로 플레이 흐름과 경험이 어떻게 변화하는지를 연구하며 게임을 플레이했습니다.<br>\n또한 동일 장르 내에서 각 게임이 제공하는 차별화된 경험과 시스템을 분석하여,<br>\n사용자 경험을 구성하는 핵심 요소와 시스템 설계 의도를 이해하고자 했습니다.<br>\n[게임 플레이 이력 리스트](https://designer-kimeunsu.notion.site/37cdab2edfee8071bb1dd8787a768bf3)<br>\n배경 이미지에 있는 것은 'USS CV-4 RANGER'의 측면 블루프린트이며<br>\n '월드 오브 워쉽'(OLD 199판, NEW 74판)과 '칸코레'(99레벨)를 플레이하며 애정을 가진 함선입니다."]]},"media":[{"page":"intro","keyword":"게임 디자이너로서 나","paths":["resource/images/intro/Image_A2_01.png","resource/images/intro/Image_A2_05.png"]},{"page":"intro","keyword":"현재 하고 있는 것","paths":["resource/images/intro/Image_A2_02.png","resource/images/intro/Image_A2_06.png"]},{"page":"intro","keyword":"그동안 해온 것","paths":["resource/images/intro/Image_A2_03.png","resource/images/intro/Image_A2_07.png"]},{"page":"intro","keyword":"오타쿠로서 나","paths":["resource/images/intro/Image_A2_04.png","resource/images/intro/Image_A2_08.png"]},{"page":"develop","keyword":"프로젝트 테스트 영상","paths":["resource/images/develop/Image_B1_01.png","resource/images/develop/Image_B1_05.png"]},{"page":"develop","keyword":"게임의 가치와 방향","paths":["resource/images/develop/Image_B1_02.png","resource/images/develop/Image_B1_06.png"]},{"page":"develop","keyword":"제공하고자 하는 경험","paths":["resource/images/develop/Image_B1_03.png","resource/images/develop/Image_B1_07.png"]},{"page":"develop","keyword":"플레이 경험을 반영","paths":["resource/images/develop/Image_B1
