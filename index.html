iv id="helm-control"><img class="helm-frame" src="resource/helm_frame.svg" alt=""><div id="helm-wheel" aria-hidden="true"></div><button id="starboard" class="corner-button" type="button"><span class="corner tl"></span><span class="corner tr"></span><span class="corner bl"></span><span class="corner br"></span><span>우현으로</span></button></div></div></div><script id="portfolio-data" type="application/json">{"pages":["profile","intro","develop","play","observe","rts","tamagotchi","documents","history"],"pageCodes":["A1","A2","B1","B2","B3","C1","C1","C2","D1"],"camera":[{"x":150,"y":-105},{"x":400,"y":401},{"x":540,"y":401},{"x":688,"y":401},{"x":852,"y":401},{"x":1016,"y":401},{"x":1180,"y":401},{"x":1370,"y":401},{"x":1622,"y":401}],"strings":{"string_develop_1.csv":[["3001_title","게임을 개발하고,"],["3001_keyword","프로젝트 사진"],["30101","미사일 RTS 게임 프로젝트<br>Project Name : 제로 신호의 츠키가사"],["30102","ゼロ信号のつきがさ<br>Zero Shingō no Tsukigasa"],["30103","[MISSILE DEFENSE ROGUELITE](https://admiralgond.github.io/ZeroShingoNoTsukigasa/)"],["30104","개발 중인 게임 화면 ▶<br>문서는 하단에 있습니다."],["30105","v2026.11.18.3 - 클로드 기본 UI미교체"],["3002_keyword","게임의 가치와 방향"],["30201","밀리터리 덕후가 군함에 가진 판타지를 게임으로 경험시킨다."],["30202","밀리터리 덕후가 원하는 것은 자신의 판단으로 전투의 승패를 가르는 지휘관의 경험."],["30203","저는 게임이 현실에서 체험하기 어려운 경험과 판타지를 대리 만족해주는 수단이라고 생각합니다."],["30204","현대 미사일 군함의 전투의 경우 밀리터리 덕후에게 매력적인 소재이지만,<br>현실에서 직접 경험하기는 어렵습니다."],["30205","이에 군함에서 가장 위험한 적을 식별하고 요격하기까지의 판단 과정을 전략 게임의 경험으로 치환하여,<br>밀리터리 덕후가 현대 해전에 가진 판타지를 제공하는 게임을 개발하고 있습니다."],["3003_keyword","제공하고자 하는 경험"],["30301","이 게임이 전달하려는 전략성은 '시간이라는 단위의 수를 읽는 전투'입니다."],["30302","현재 화면에 보이는 미사일에 단순히 반응하는 것이 아닌,<br>”몇 초 뒤 어떤 미사일이 먼저 도착하고 어떤 교전 채널이 먼저 비는지를 읽은 뒤<br>다음 행동을 선행해서 준비하는 과정”을 목표 경험으로 하고 있습니다."],["3004_keyword","플레이 경험을 반영"],["30401","그동안 게임의 전략 플레이 경험을 바탕으로 게임의 전략성을 검증하면서 구현하고 있습니다.<br>의도한 경험이 전달되는지 확인하며 실제로 필요한 시스템인지 판단하고 있습니다."],["30402","이런 플레이 경험을 통해 게임이 덕후가 품었던 로망을 직접 경험하게 해 준다는 점을 알게 되었습니다.<br>플레이어에게 이러한 대리 만족을 제공하는 것이 제가 추구하는 게임 개발의 방향입니다."]],"string_document
