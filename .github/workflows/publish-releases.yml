name: Publish portfolio releases
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check CSV build
        run: python source/build.py check
      - name: Publish v0.10.12
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git archive --format=zip --output="$RUNNER_TEMP/kimeunsuportfolio-v0.10.12.zip" "$GITHUB_SHA" -- README.md index.html resource source
          cat > "$RUNNER_TEMP/v0.10.12-notes.md" <<'EOF'
          - D1 키워드 버튼 제목의 기존 두 줄 표시 유지
          - D1 보고서 제목행 전용 9002_report_title 문자열 키 분리
          - 보고서 제목행 한 줄 표시 및 기존 콘텐츠·영상·레이아웃 유지
          EOF
          if ! gh release view v0.10.12 >/dev/null 2>&1; then
            gh release create v0.10.12 --target "$GITHUB_SHA" --title 'Portfolio Site v0.10.12' --notes-file "$RUNNER_TEMP/v0.10.12-notes.md"
          else
            gh api -X PATCH "repos/${GITHUB_REPOSITORY}/git/refs/tags/v0.10.12" -f sha="$GITHUB_SHA" -F force=true >/dev/null
            gh release edit v0.10.12 --target "$GITHUB_SHA" --notes-file "$RUNNER_TEMP/v0.10.12-notes.md"
          fi
          gh release upload v0.10.12 "$RUNNER_TEMP/kimeunsuportfolio-v0.10.12.zip" --clobber
