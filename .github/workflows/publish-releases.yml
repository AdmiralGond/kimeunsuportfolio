name: Publish portfolio releases
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Publish v0.4.0 site archive
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git archive --format=zip --output="$RUNNER_TEMP/kimeunsuportfolio-v0.4.0.zip" "$GITHUB_SHA" -- index.html resource source
          if ! gh release view v0.4.0 >/dev/null 2>&1; then
            gh release create v0.4.0 --target "$GITHUB_SHA" --title 'Portfolio Site Draft v0.4.0' --notes 'Camera/world-content separation, hangar-based Y-aligned camera and distance-based zoom, faithful SVG panel contours, squared left-extended helm base, new SVG wheel sprite, original OTF fonts and exact image filenames. Chromium interaction and asset structure tests performed. GitHub Pages live-rendering not yet verified.'
          fi
          gh release upload v0.4.0 "$RUNNER_TEMP/kimeunsuportfolio-v0.4.0.zip" --clobber
