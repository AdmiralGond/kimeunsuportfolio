name: Publish portfolio releases
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check CSV build
        run: python source/build.py check
      - name: Publish v0.10.9
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git archive --format=zip --output="$RUNNER_TEMP/kimeunsuportfolio-v0.10.9.zip" "$GITHUB_SHA" -- README.md index.html resource source
          cat > "$RUNNER_TEMP/v0.10.9-notes.md" <<'EOF'
          - v0.10.8 기준 C1 다마고치 문구 및 C2·D1 본문 CSV 갱신
          - D1 AI 워크 플로우 90101 본문 추가
          - C2 기존 표 부모 ID와 표 파일 및 스타일 보존
          - C2·D1 문서 링크를 클릭 가능한 형식으로 적용
          - A2 20201·20301과 B2 40201의 (URL) 표기를 클릭 가능한 링크로 복구
          - C2 기여하고 싶습니다. 80401의 지정 위치에 <br> 추가
          - CSV UTF-8 BOM 및 index.html 빌드 검사
          EOF
          if ! gh release view v0.10.9 >/dev/null 2>&1; then
            gh release create v0.10.9 --target "$GITHUB_SHA" --title 'Portfolio Site v0.10.9' --notes-file "$RUNNER_TEMP/v0.10.9-notes.md"
          else
            gh api -X PATCH "repos/${GITHUB_REPOSITORY}/git/refs/tags/v0.10.9" -f sha="$GITHUB_SHA" -F force=true >/dev/null
            gh release edit v0.10.9 --target "$GITHUB_SHA" --notes-file "$RUNNER_TEMP/v0.10.9-notes.md"
          fi
          gh release upload v0.10.9 "$RUNNER_TEMP/kimeunsuportfolio-v0.10.9.zip" --clobber
