name: Publish portfolio releases
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check CSV build
        run: python source/build.py check
      - name: Publish v0.10.7
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git archive --format=zip --output="$RUNNER_TEMP/kimeunsuportfolio-v0.10.7.zip" "$GITHUB_SHA" -- README.md index.html resource source
          cat > "$RUNNER_TEMP/v0.10.7-notes.md" <<'EOF'
          - 첨부 A1·A2·B1·B2·B3 문자열 CSV 반영
          - B2 인간 튜토리얼 본문 ID 40301 추가 및 기존 표 유지
          - B1 프로젝트 테스트 영상 2개 자동 출력 제거
          - videos.csv 삭제 및 우현으로 버튼 기존 새 탭 링크 유지
          - CSV UTF-8 BOM 및 index.html 정적 빌드 동기화
          EOF
          if ! gh release view v0.10.7 >/dev/null 2>&1; then
            gh release create v0.10.7 --target "$GITHUB_SHA" --title 'Portfolio Site v0.10.7' --notes-file "$RUNNER_TEMP/v0.10.7-notes.md"
          else
            gh api -X PATCH "repos/${GITHUB_REPOSITORY}/git/refs/tags/v0.10.7" -f sha="$GITHUB_SHA" -F force=true >/dev/null
            gh release edit v0.10.7 --target "$GITHUB_SHA" --notes-file "$RUNNER_TEMP/v0.10.7-notes.md"
          fi
          gh release upload v0.10.7 "$RUNNER_TEMP/kimeunsuportfolio-v0.10.7.zip" --clobber
