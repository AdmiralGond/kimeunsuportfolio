name: Publish portfolio releases
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Publish v0.7.0
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git archive --format=zip --output="$RUNNER_TEMP/kimeunsuportfolio-v0.7.0.zip" "$GITHUB_SHA" -- index.html resource source
          cat > "$RUNNER_TEMP/v0.7.0-notes.md" <<'EOF'
          - A1 하단 우측 여백으로 세로쓰기 스크롤 안내 이동
          - 페이지 전환을 1,200ms로 조정하고 직선 경로·완만한 속도 곡선 유지
          - 밀리터리 게임 경험 표를 본문 위로 배치
          - 페이지 콘텐츠 상시 표시 및 격납고별 X좌표 간격 정렬
          - 프로필 제원 제목·본문의 상단 정렬 수정
          - 검은 이미지 37개를 PNG로 변경하고 높이 기준 정비율 확대·축소 적용
          EOF
          if ! gh release view v0.7.0 >/dev/null 2>&1; then
            gh release create v0.7.0 --target "$GITHUB_SHA" --title 'Portfolio Site v0.7.0' --notes-file "$RUNNER_TEMP/v0.7.0-notes.md"
          else
            gh release edit v0.7.0 --notes-file "$RUNNER_TEMP/v0.7.0-notes.md"
          fi
          gh release upload v0.7.0 "$RUNNER_TEMP/kimeunsuportfolio-v0.7.0.zip" --clobber
