name: Publish portfolio releases
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Publish v0.8.0
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git archive --format=zip --output="$RUNNER_TEMP/kimeunsuportfolio-v0.8.0.zip" "$GITHUB_SHA" -- index.html resource source
          cat > "$RUNNER_TEMP/v0.8.0-notes.md" <<'EOF'
          - 페이지별 카메라 중심을 좌표 가이드의 초록 영역 9개 중심에 맞추고 16:9 영역의 배율 적용
          - D1 페이지명을 'AI 워크 플로우 및 플레이 이력'으로 변경하고 'AI 워크 플로우'·'플레이 이력' 2개 키워드 구성
          - 미사일 RTS(C1) 키워드 순서를 '프로젝트 개요'·'프로젝트 문서'·'프로젝트 문제 해결'·'초심자와 숙련자 차이'로 변경하고 기존 본문 연결 재배치
          EOF
          if ! gh release view v0.8.0 >/dev/null 2>&1; then
            gh release create v0.8.0 --target "$GITHUB_SHA" --title 'Portfolio Site v0.8.0' --notes-file "$RUNNER_TEMP/v0.8.0-notes.md"
          else
            gh release edit v0.8.0 --notes-file "$RUNNER_TEMP/v0.8.0-notes.md"
          fi
          gh release upload v0.8.0 "$RUNNER_TEMP/kimeunsuportfolio-v0.8.0.zip" --clobber
