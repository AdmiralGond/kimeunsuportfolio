name: Publish portfolio releases
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Publish v0.10.0
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git archive --format=zip --output="$RUNNER_TEMP/kimeunsuportfolio-v0.10.0.zip" "$GITHUB_SHA" -- README.md index.html resource source
          cat > "$RUNNER_TEMP/v0.10.0-notes.md" <<'EOF'
          - 엑셀 도구 숙련도를 4 / 10으로 변경
          - 프로필·보고서 이미지 클릭 시 중앙 확대와 배경 어둡게 처리 추가
          - 확대 이미지의 이전·다음 이동, 닫기 버튼 및 이미지 순번 표시 추가
          EOF
          if ! gh release view v0.10.0 >/dev/null 2>&1; then
            gh release create v0.10.0 --target "$GITHUB_SHA" --title 'Portfolio Site v0.10.0' --notes-file "$RUNNER_TEMP/v0.10.0-notes.md"
          else
            gh release edit v0.10.0 --notes-file "$RUNNER_TEMP/v0.10.0-notes.md"
          fi
          gh release upload v0.10.0 "$RUNNER_TEMP/kimeunsuportfolio-v0.10.0.zip" --clobber
