name: Publish portfolio releases
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Publish v0.1.0 historical source
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git archive --format=zip --output="$RUNNER_TEMP/kimeunsuportfolio-v0.1.0.zip" 3b9ea99db0b2a988c1a6a018139e441fc92e1e35 -- index.html resource source
          if ! gh release view v0.1.0 >/dev/null 2>&1; then
            gh release create v0.1.0 --target 3b9ea99db0b2a988c1a6a018139e441fc92e1e35 --title 'Portfolio Site Draft v0.1.0' --notes 'Initial development draft. Historical release; superseded by v0.2.0.'
          fi
          gh release upload v0.1.0 "$RUNNER_TEMP/kimeunsuportfolio-v0.1.0.zip" --clobber
      - name: Publish v0.2.0 site archive
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git archive --format=zip --output="$RUNNER_TEMP/kimeunsuportfolio-v0.2.0.zip" "$GITHUB_SHA" -- index.html resource source
          if ! gh release view v0.2.0 >/dev/null 2>&1; then
            gh release create v0.2.0 --target "$GITHUB_SHA" --title 'Portfolio Site Draft v0.2.0' --notes 'Reworked reference frame, local NEXON font assets, original-named SVG image placeholders, keyword image mapping and updated helm rotation. Notion media remains placeholders. Live browser validation pending.'
          fi
          gh release upload v0.2.0 "$RUNNER_TEMP/kimeunsuportfolio-v0.2.0.zip" --clobber
