name: Publish portfolio releases
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check CSV build
        run: python source/build.py check
      - name: Publish v0.10.11
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git archive --format=zip --output="$RUNNER_TEMP/kimeunsuportfolio-v0.10.11.zip" "$GITHUB_SHA" -- README.md index.html resource source
          cat > "$RUNNER_TEMP/v0.10.11-notes.md" <<'EOF'
          - D1 키워드 제목의 <br>을 실제 줄바꿈으로 표시
          - B1 프로젝트 테스트 영상의 검은색 이미지 두 개를 유튜브 플레이어로 교체
          - 좌우 영상 16:9 비율 및 기존 높이 181.39px 유지, 자동재생 해제
          - 기존 키워드 본문·표·다른 이미지·레이아웃·조타 장치 동작 보존
          EOF
          if ! gh release view v0.10.11 >/dev/null 2>&1; then
            gh release create v0.10.11 --target "$GITHUB_SHA" --title 'Portfolio Site v0.10.11' --notes-file "$RUNNER_TEMP/v0.10.11-notes.md"
          else
            gh api -X PATCH "repos/${GITHUB_REPOSITORY}/git/refs/tags/v0.10.11" -f sha="$GITHUB_SHA" -F force=true >/dev/null
            gh release edit v0.10.11 --target "$GITHUB_SHA" --notes-file "$RUNNER_TEMP/v0.10.11-notes.md"
          fi
          gh release upload v0.10.11 "$RUNNER_TEMP/kimeunsuportfolio-v0.10.11.zip" --clobber
