name: Publish portfolio releases
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Publish v0.3.0 site archive
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git archive --format=zip --output="$RUNNER_TEMP/kimeunsuportfolio-v0.3.0.zip" "$GITHUB_SHA" -- index.html resource source
          if ! gh release view v0.3.0 >/dev/null 2>&1; then
            gh release create v0.3.0 --target "$GITHUB_SHA" --title 'Portfolio Site Draft v0.3.0' --notes 'Rebuilt camera positions from ship coordinates, restored common SVG frame and profile layout, redrew helm wheel and base, corrected keyword/media mapping, preserved image placeholders and bundled original font assets. Browser interaction tested via Chromium using inline source; full GitHub Pages hosting smoke test remains pending.'
          fi
          gh release upload v0.3.0 "$RUNNER_TEMP/kimeunsuportfolio-v0.3.0.zip" --clobber
