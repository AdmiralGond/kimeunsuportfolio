name: Publish portfolio releases
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check CSV build
        run: python source/build.py check
      - name: Publish v0.10.6
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git archive --format=zip --output="$RUNNER_TEMP/kimeunsuportfolio-v0.10.6.zip" "$GITHUB_SHA" -- README.md index.html resource source
          cat > "$RUNNER_TEMP/v0.10.6-notes.md" <<'EOF'
          - v0.10.5를 기준으로 첨부된 A1·A2·B1 문자열 CSV 3개 반영
          - B1 키워드 명칭 변경에 따른 이미지 및 영상 연결 유지
          - CSV UTF-8 BOM 인코딩 보존 및 빌드 동기화 검사
          EOF
          if ! gh release view v0.10.6 >/dev/null 2>&1; then
            gh release create v0.10.6 --target "$GITHUB_SHA" --title 'Portfolio Site v0.10.6' --notes-file "$RUNNER_TEMP/v0.10.6-notes.md"
          else
            gh release edit v0.10.6 --target "$GITHUB_SHA" --notes-file "$RUNNER_TEMP/v0.10.6-notes.md"
          fi
          gh release upload v0.10.6 "$RUNNER_TEMP/kimeunsuportfolio-v0.10.6.zip" --clobber
