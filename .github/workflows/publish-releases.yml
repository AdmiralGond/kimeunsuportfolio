name: Publish portfolio releases
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check CSV build
        run: python source/build.py check
      - name: Publish v0.11.1
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git archive --format=zip --output="$RUNNER_TEMP/kimeunsuportfolio-v0.11.1.zip" "$GITHUB_SHA" -- README.md index.html resource source
          cat > "$RUNNER_TEMP/v0.11.1-notes.md" <<'EOF'
          - 전 페이지 키워드 이미지 번호를 좌측 01·우측 02 연속 쌍으로 정렬
          - B1 첫 키워드는 영상 유지, 나머지 이미지 및 RTS·다마고치 파일명 재연결
          - GitHub Pages 상대 경로와 로컬 Python 빌드 이미지 데이터 분리
          - 검은색 PNG 57개에 외곽선 1px 직접 적용 및 별도 CSS 외곽선 제거
          EOF
          if ! gh release view v0.11.1 >/dev/null 2>&1; then
            gh release create v0.11.1 --target "$GITHUB_SHA" --title 'Portfolio Site v0.11.1' --notes-file "$RUNNER_TEMP/v0.11.1-notes.md"
          else
            gh api -X PATCH "repos/${GITHUB_REPOSITORY}/git/refs/tags/v0.11.1" -f sha="$GITHUB_SHA" -F force=true >/dev/null
            gh release edit v0.11.1 --target "$GITHUB_SHA" --notes-file "$RUNNER_TEMP/v0.11.1-notes.md"
          fi
          gh release upload v0.11.1 "$RUNNER_TEMP/kimeunsuportfolio-v0.11.1.zip" --clobber
