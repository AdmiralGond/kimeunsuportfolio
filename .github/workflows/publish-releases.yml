name: Publish portfolio releases
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Publish v0.9.0
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git archive --format=zip --output="$RUNNER_TEMP/kimeunsuportfolio-v0.9.0.zip" "$GITHUB_SHA" -- index.html resource source
          cat > "$RUNNER_TEMP/v0.9.0-notes.md" <<'EOF'
          - A1 도구 영역 4개에 아이콘과 가로 숙련도 막대 그래프 8개 추가
          - 파워포인트·엑셀·워드·노션·포토샵·일러스트레이터·마야·맥스의 10점 만점 점수 표시
          - 그래프 호버 시 도구별 설명 툴팁 표시 및 마야·맥스 외부 작업물 연결
          EOF
          if ! gh release view v0.9.0 >/dev/null 2>&1; then
            gh release create v0.9.0 --target "$GITHUB_SHA" --title 'Portfolio Site v0.9.0' --notes-file "$RUNNER_TEMP/v0.9.0-notes.md"
          else
            gh release edit v0.9.0 --notes-file "$RUNNER_TEMP/v0.9.0-notes.md"
          fi
          gh release upload v0.9.0 "$RUNNER_TEMP/kimeunsuportfolio-v0.9.0.zip" --clobber
