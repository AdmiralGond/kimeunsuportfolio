name: Publish portfolio releases
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Publish v0.10.2
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git archive --format=zip --output="$RUNNER_TEMP/kimeunsuportfolio-v0.10.2.zip" "$GITHUB_SHA" -- README.md index.html resource source
          cat > "$RUNNER_TEMP/v0.10.2-notes.md" <<'EOF'
          - 카메라 전환 중 축소량을 기존의 1/5로 조정
          - 배경 보조 그리드 간격을 6px, 주요 그리드 간격을 30px로 조정
          - B2 서브컬처 게임 경험 표를 본문 위로 배치
          EOF
          if ! gh release view v0.10.2 >/dev/null 2>&1; then
            gh release create v0.10.2 --target "$GITHUB_SHA" --title 'Portfolio Site v0.10.2' --notes-file "$RUNNER_TEMP/v0.10.2-notes.md"
          else
            gh api -X PATCH "repos/${GITHUB_REPOSITORY}/git/refs/tags/v0.10.2" -f sha="$GITHUB_SHA" -F force=true >/dev/null
            gh release edit v0.10.2 --target "$GITHUB_SHA" --notes-file "$RUNNER_TEMP/v0.10.2-notes.md"
          fi
          gh release upload v0.10.2 "$RUNNER_TEMP/kimeunsuportfolio-v0.10.2.zip" --clobber