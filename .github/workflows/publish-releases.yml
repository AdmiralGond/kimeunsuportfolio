name: Publish portfolio releases
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check CSV build
        run: python source/build.py check
      - name: Publish v0.10.10
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git archive --format=zip --output="$RUNNER_TEMP/kimeunsuportfolio-v0.10.10.zip" "$GITHUB_SHA" -- README.md index.html resource source
          cat > "$RUNNER_TEMP/v0.10.10-notes.md" <<'EOF'
          - v0.10.9 기준 제공된 8개 페이지 문자열 CSV의 텍스트 변경 반영
          - CSV 내 (URL)은 사용자 표시 문자열의 하이퍼링크로 유지
          - B1·D1의 변경된 키워드명과 이미지 연결 데이터 동기화
          - D1 키워드 제목의 <br> 줄바꿈 표시
          - 기존 다섯 표·스타일·레이아웃·우현으로 링크 보존
          - CSV UTF-8 BOM 및 index.html 빌드 일치 검사
          EOF
          if ! gh release view v0.10.10 >/dev/null 2>&1; then
            gh release create v0.10.10 --target "$GITHUB_SHA" --title 'Portfolio Site v0.10.10' --notes-file "$RUNNER_TEMP/v0.10.10-notes.md"
          else
            gh api -X PATCH "repos/${GITHUB_REPOSITORY}/git/refs/tags/v0.10.10" -f sha="$GITHUB_SHA" -F force=true >/dev/null
            gh release edit v0.10.10 --target "$GITHUB_SHA" --notes-file "$RUNNER_TEMP/v0.10.10-notes.md"
          fi
          gh release upload v0.10.10 "$RUNNER_TEMP/kimeunsuportfolio-v0.10.10.zip" --clobber
